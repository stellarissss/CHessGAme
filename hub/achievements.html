<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html { zoom: 0.75; }</style>
    <title>棋圣 · 成就殿堂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/achievements.css">
</head>
<body>
    <div class="ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container ach-container">
        <header class="hero ach-hero">
            <a href="/hub" class="back-link">← 返回总坛</a>
            <h1 class="hero-title">
                <span class="title-main">成就殿堂</span>
                <span class="title-sub">Hall of Achievements</span>
            </h1>
            <div class="progress-bar-wrap">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text" id="progress-text">0 / 0</div>
            </div>
        </header>

        <nav class="filter-bar" id="filter-bar">
            <button class="filter-btn active" data-cat="all">全部</button>
            <button class="filter-btn" data-cat="board">棋盘操控</button>
            <button class="filter-btn" data-cat="ai_create">AI创造</button>
            <button class="filter-btn" data-cat="rule_break">规则破坏</button>
            <button class="filter-btn" data-cat="chat">AI对话</button>
            <button class="filter-btn" data-cat="mechanism">机制</button>
            <button class="filter-btn" data-cat="event">游戏事件</button>
            <button class="filter-btn" data-cat="usage">消耗</button>
            <button class="filter-btn" data-cat="meta">元成就</button>
        </nav>

        <div class="ach-tools">
            <input type="search" id="ach-search" class="ach-search" placeholder="🔍 搜索成就名称 / 描述…" autocomplete="off">
            <div class="ach-selects">
                <select id="filter-rarity" class="ach-select" aria-label="按稀有度筛选">
                    <option value="all">稀有度 · 全部</option>
                    <option value="common">普通</option>
                    <option value="rare">稀有</option>
                    <option value="legendary">传说</option>
                </select>
                <select id="filter-status" class="ach-select" aria-label="按状态筛选">
                    <option value="all">状态 · 全部</option>
                    <option value="unlocked">已解锁</option>
                    <option value="locked">未解锁</option>
                </select>
            </div>
            <span class="ach-count" id="ach-count"></span>
        </div>

        <section class="ach-grid" id="ach-grid">
            <div class="loading-text">正在加载成就数据…</div>
        </section>

        <footer class="footer ach-footer">
            <p>集齐全部成就，登顶棋圣之巅</p>
            <p class="footer-note">成就存档保存在 <code>achievements.json</code></p>
        </footer>
    </main>

    <script src="/static/achievements.js"></script>
</body>
</html>
