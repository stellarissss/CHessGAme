<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋圣 · 六道众生</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="container">
        <header class="hero">
            <h1 class="hero-title">
                <span class="title-main">六道众生</span>
                <span class="title-sub">AI 作弊棋类总坛</span>
            </h1>
            <p class="hero-desc">
                六重棋境，一念改规。大模型为饵，规则为网，<br>
                点击任一入口，即可坠入对应棋局的“灵活编码”之界。
            </p>
            <div class="hero-meta" id="hub-meta">正在连接总坛服务…</div>
        </header>

        <a href="/achievements" class="ach-banner" id="ach-banner">
            <span class="ach-banner-icon">🏆</span>
            <span class="ach-banner-text">
                <span class="ach-banner-title">成就殿堂</span>
                <span class="ach-banner-sub" id="ach-banner-progress">加载中…</span>
            </span>
            <span class="ach-banner-arrow">→</span>
        </a>

        <section class="grid" id="game-grid">
            <!-- Cards will be injected by app.js -->
        </section>

        <footer class="footer">
            <p>棋圣 ChessSage · 灵活编码 Flexible Coding</p>
            <p class="footer-note">所有棋类服务均由 <code>main.py</code> 统一拉起</p>
        </footer>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
