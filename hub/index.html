<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>棋圣 · 六道众生</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .back-link {
            position: fixed; top: 20px; left: 24px; z-index: 10;
            color: var(--text-muted); text-decoration: none; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--gold); }
    </style>
</head>
<body>
    <div class="ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <a href="/" class="back-link">← 返回标题页</a>

    <main class="container">
        <header class="hero">
            <h1 class="hero-title">
                <span class="title-main">六道轮回</span>
                <span class="title-sub">SAMSARA</span>
            </h1>
            <p class="hero-desc">
                六重棋境，一念改规。业力为媒，规则为网，<br>
                在轮回中修行，在棋局中悟道。
            </p>
            <div class="hero-meta" id="hub-meta">正在连接轮回之门…</div>
        </header>

        <div class="samsara-status" id="samsara-status">
            <div class="status-item">
                <span class="status-icon">👁️</span>
                <span class="status-label">识破</span>
                <div class="status-bar">
                    <div class="status-fill detection-fill" id="detection-fill"></div>
                </div>
                <span class="status-value" id="detection-value">0%</span>
            </div>
            <div class="status-item">
                <span class="status-icon">🎭</span>
                <span class="status-label">境界</span>
                <span class="status-value realm-value" id="current-realm">地狱道</span>
            </div>
            <div class="status-item">
                <span class="status-icon">⭐</span>
                <span class="status-label">技能点</span>
                <span class="status-value skill-value" id="skill-points">0</span>
            </div>
        </div>

        <button class="skill-tree-btn" id="skill-tree-btn">
            <span class="skill-icon">🌳</span>
            <span class="skill-text">技能树</span>
        </button>

        <div class="skill-tree-modal" id="skill-tree-modal">
            <div class="skill-tree-content">
                <div class="skill-tree-header">
                    <h2>技能树</h2>
                    <button class="close-skill-btn" id="close-skill-btn">✕</button>
                </div>
                <div class="skill-branches" id="skill-branches"></div>
            </div>
        </div>

        <a href="/achievements" class="ach-banner" id="ach-banner">
            <span class="ach-banner-icon">🏆</span>
            <span class="ach-banner-text">
                <span class="ach-banner-title">成就殿堂</span>
                <span class="ach-banner-sub" id="ach-banner-progress">加载中…</span>
            </span>
            <span class="ach-banner-arrow">→</span>
        </a>

        <!-- RPG 系统入口 -->
        <section class="rpg-hub" id="rpg-hub">
            <h2 class="rpg-hub-title">轮回修行</h2>
            <div class="rpg-stats">
                <div class="rpg-stat-item">
                    <span class="rpg-stat-icon">✨</span>
                    <span class="rpg-stat-label">悟道</span>
                    <span class="rpg-stat-value" id="rpg-enlightenment">0</span>
                </div>
                <div class="rpg-stat-item">
                    <span class="rpg-stat-icon">🌑</span>
                    <span class="rpg-stat-label">堕落</span>
                    <span class="rpg-stat-value" id="rpg-corruption">0</span>
                </div>
                <div class="rpg-stat-item">
                    <span class="rpg-stat-icon">🙏</span>
                    <span class="rpg-stat-label">祈求</span>
                    <span class="rpg-stat-value" id="rpg-prayer">0</span>
                </div>
                <div class="rpg-stat-item">
                    <span class="rpg-stat-icon">🧩</span>
                    <span class="rpg-stat-label">记忆碎片</span>
                    <span class="rpg-stat-value" id="rpg-fragments">0/6</span>
                </div>
            </div>
            <div class="rpg-ending-preview" id="rpg-ending-preview">
                <span class="ending-preview-label">结局预览：</span>
                <span class="ending-preview-name" id="rpg-ending-name">加载中…</span>
            </div>
            <div class="rpg-actions">
                <a href="/dialogue?mode=prologue" class="rpg-action-btn">
                    <span class="rpg-action-icon">📜</span>
                    <span class="rpg-action-text">序章</span>
                </a>
                <a href="/memory-album" class="rpg-action-btn">
                    <span class="rpg-action-icon">📷</span>
                    <span class="rpg-action-text">记忆相册</span>
                </a>
                <a href="/heaven-boss" class="rpg-action-btn" id="rpg-boss-btn" style="display:none;">
                    <span class="rpg-action-icon">⚖️</span>
                    <span class="rpg-action-text">天道审判</span>
                </a>
                <a href="/ending" class="rpg-action-btn">
                    <span class="rpg-action-icon">🎬</span>
                    <span class="rpg-action-text">结局</span>
                </a>
            </div>
        </section>

        <section class="grid" id="game-grid">
            <!-- Cards will be injected by app.js -->
        </section>

        <footer class="footer">
            <p>棋圣 ChessSage · 六道轮回 Samsara</p>
            <p class="footer-note">所有棋类服务均由 <code>main.py</code> 统一拉起</p>
        </footer>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
