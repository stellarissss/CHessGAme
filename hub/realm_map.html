<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>html { zoom: 0.75; }</style>
    <title>道内小地图</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .back-link {
            position: fixed; top: 20px; left: 24px; z-index: 20;
            color: var(--text-muted); text-decoration: none; font-size: 13px;
            display: flex; align-items: center; gap: 6px;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--gold); }

        .map-header { text-align: center; margin-bottom: 10px; }
        .realm-title { font-family: var(--font-display); font-size: 44px; color: var(--rc-accent, var(--gold)); margin: 0; letter-spacing: 0.08em; text-shadow: 0 0 30px var(--rc-glow, rgba(212,175,55,0.3)); }
        .realm-sub { font-family: var(--font-tech); font-size: 11px; color: var(--gold-dim); letter-spacing: 0.3em; margin-top: 6px; }
        .map-progress-stat { font-family: var(--font-tech); font-size: 12px; letter-spacing: 0.12em; margin-top: 6px; }
        .map-banner {
            display: inline-flex; align-items: center; gap: 8px;
            margin-top: 10px; padding: 6px 18px;
            border-radius: 999px; font-size: 13px; letter-spacing: 0.08em;
            opacity: 0; transform: translateY(-4px);
            transition: opacity 0.35s, transform 0.35s;
        }
        .map-banner.active { opacity: 1; transform: translateY(0); }
        .map-banner.won {
            color: var(--jade);
            border: 1px solid rgba(13,115,119,0.5);
            background: rgba(13,115,119,0.12);
            box-shadow: 0 0 24px rgba(13,115,119,0.25);
        }
        .map-legend {
            display: flex; justify-content: center; gap: 18px; flex-wrap: wrap;
            margin: 14px 0 6px; font-size: 12px; color: var(--text-muted);
        }
        .map-legend span { display: inline-flex; align-items: center; gap: 5px; }

        /* ── 小地图画布（元气骑士式）── */
        .map-canvas-wrap {
            position: relative;
            max-width: 1060px; margin: 0 auto;
            padding: 30px 20px 40px;
        }
        .map-canvas {
            position: relative;
            width: 100%;
            padding-bottom: 62%;
            min-height: 420px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            backdrop-filter: blur(14px);
            overflow: hidden;
        }
        .map-canvas svg.map-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
        .map-canvas .line { stroke: rgba(255,255,255,0.14); stroke-width: 2; }
        .map-canvas .line.lit { stroke: var(--rc-accent, var(--gold)); stroke-dasharray: 6 4; opacity: 0.8; }

        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
            width: 84px; height: 84px;
            border-radius: 50%;
            background: var(--bg-panel);
            border: 2px solid rgba(255,255,255,0.22);
            cursor: default;
            user-select: none;
            transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s, opacity 0.3s;
            z-index: 2;
        }
        .node .n-icon { font-size: 26px; line-height: 1.1; }
        .node .n-label { font-size: 11px; margin-top: 3px; color: var(--text-main); max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .node[data-status="cleared"] { border-color: var(--jade); box-shadow: 0 0 22px rgba(13,115,119,0.35); }
        .node[data-status="cleared"] .n-icon::after { content: " ✓"; color: var(--jade); font-size: 12px; }
        .node[data-status="available"] {
            border-color: var(--rc-accent, var(--gold));
            cursor: pointer;
            box-shadow: 0 0 24px var(--rc-glow, rgba(212,175,55,0.35));
            animation: nodePulse 1.8s ease-in-out infinite;
        }
        .node[data-status="available"]:hover { transform: translate(-50%,-50%) scale(1.12); z-index: 5; }
        .node[data-status="locked"] { opacity: 0.42; filter: grayscale(0.7); }
        .node[data-status="locked"] .n-icon { content: "🔒"; }
        .node[data-status="locked"].is-locked::before { content: "🔒"; position: absolute; font-size: 16px; top: -4px; right: -4px; }

        /* 占位节点（待制作，强烈标注） */
        .node.placeholder {
            border-style: dashed;
            border-color: rgba(155,35,53,0.7);
            background: repeating-linear-gradient(45deg, rgba(155,35,53,0.12) 0 8px, transparent 8px 16px);
            cursor: not-allowed;
        }
        .node.placeholder .n-label { color: var(--text-muted); }
        .node .todo-tag {
            position: absolute; top: -8px; right: -10px;
            padding: 2px 6px;
            border-radius: 8px;
            background: var(--crimson);
            color: #fff;
            font-size: 9px;
            letter-spacing: 0.05em;
            transform: rotate(8deg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .node.boss { width: 100px; height: 100px; border-width: 3px; border-color: var(--crimson); }
        .node.boss .n-icon { font-size: 32px; }
        .node.boss[data-status="available"] { animation: bossPulse 1.6s ease-in-out infinite; }

        .node.n-start { width: 74px; height: 74px; }
        .node.n-start .n-icon::after { content: ""; }

        @keyframes nodePulse {
            0%, 100% { box-shadow: 0 0 16px var(--rc-glow, rgba(212,175,55,0.3)); }
            50% { box-shadow: 0 0 34px var(--rc-glow, rgba(212,175,55,0.6)); }
        }
        @keyframes bossPulse {
            0%, 100% { box-shadow: 0 0 18px rgba(192,57,43,0.4); }
            50% { box-shadow: 0 0 40px rgba(192,57,43,0.8); }
        }

        /* 节点信息浮层 */
        .node-tip {
            position: absolute; z-index: 10;
            left: 50%; bottom: calc(100% + 12px);
            transform: translateX(-50%);
            min-width: 180px; max-width: 240px;
            padding: 10px 14px;
            background: rgba(10,10,16,0.96);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.7);
            pointer-events: none;
            opacity: 0; visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
            text-align: left;
        }
        .node:hover .node-tip { opacity: 1; visibility: visible; }
        .node-tip .tip-name { color: var(--rc-accent, var(--gold)); font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .node-tip .tip-desc { font-size: 11px; color: var(--text-muted); line-height: 1.6; }
        .node-tip .tip-type { font-size: 10px; color: var(--gold-dim); margin-top: 4px; }
        .node-tip.tip-placeholder { border-color: rgba(155,35,53,0.6); }
        .node-tip.tip-placeholder .tip-name { color: var(--crimson); }

        /* 弹窗 */
        .map-modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.72); backdrop-filter: blur(6px); }
        .map-modal.active { display: flex; }
        .map-modal-content {
            max-width: 420px; width: 90%;
            padding: 28px 30px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .map-modal-content h3 { font-family: var(--font-display); font-size: 24px; color: var(--rc-accent, var(--gold)); margin: 0 0 12px; }
        .map-modal-content p { font-size: 13px; color: var(--text-muted); line-height: 1.9; margin: 0 0 20px; }
        .map-modal-btns { display: flex; gap: 12px; justify-content: center; }
        .modal-btn {
            padding: 9px 26px; border-radius: 6px; cursor: pointer;
            border: 1px solid var(--border); background: transparent; color: var(--text-main);
            font-family: var(--font-body); font-size: 14px; transition: all 0.25s;
        }
        .modal-btn.primary { border-color: var(--rc-accent, var(--gold)); color: var(--rc-accent, var(--gold)); }
        .modal-btn.primary:hover { background: var(--rc-accent, var(--gold)); color: var(--bg-deep); }
        .modal-btn.ghost:hover { border-color: var(--text-muted); color: var(--text-muted); }

        /* 键盘可达性：可挑战节点获得焦点时高亮 */
        .node[data-status="available"]:focus-visible {
            outline: 3px solid var(--rc-accent, var(--gold));
            outline-offset: 3px;
            transform: translate(-50%,-50%) scale(1.08);
        }

        /* 减少动态偏好：禁用呼吸/跳跃类动画 */
        @media (prefers-reduced-motion: reduce) {
            .node[data-status="available"],
            .node.boss[data-status="available"] { animation: none; }
            .node-tip, .map-banner { transition: none; }
        }
    </style>
</head>
<body>
    <div class="ambient">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <a href="/world" class="back-link">← 世界地图</a>

    <main class="container">
        <header class="map-header">
            <h1 class="realm-title" id="realm-title">…</h1>
            <div class="realm-sub" id="realm-sub">LOADING</div>
            <div class="map-progress-stat" id="map-progress-stat"></div>
            <div class="map-banner" id="map-banner" role="status"></div>
            <div class="map-legend">
                <span>🟢 可挑战</span>
                <span>✅ 已通关</span>
                <span>🔒 未解锁</span>
                <span style="color:var(--crimson);">⚠ 待制作（占位）</span>
            </div>
        </header>

        <div class="map-canvas-wrap">
            <div class="map-canvas" id="map-canvas">
                <p style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text-muted);">
                    正在加载小地图…
                </p>
            </div>
        </div>
    </main>

    <div class="map-modal" id="map-modal">
        <div class="map-modal-content" id="map-modal-content"></div>
    </div>

    <script src="/static/realm_map.js"></script>
</body>
</html>
