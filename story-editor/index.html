<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧情编辑器 - 无限制象棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶栏 -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="logo">🎮</span>
            <h1 class="app-title">剧情编辑器</h1>
            <span class="subtitle">Galgame Visual Novel Editor</span>
        </div>
        <div class="topbar-center">
            <input type="text" id="project-title" class="project-title" placeholder="未命名剧情">
        </div>
        <div class="topbar-right">
            <button id="btn-new" class="btn" title="新建剧情">📄 新建</button>
            <button id="btn-open" class="btn" title="打开剧情">📂 打开</button>
            <button id="btn-save" class="btn btn-primary" title="保存到服务器">💾 保存</button>
            <button id="btn-export" class="btn" title="导出 JSON">⬇️ 导出</button>
            <button id="btn-import" class="btn" title="导入 JSON">⬆️ 导入</button>
            <button id="btn-toggle-preview" class="btn" title="切换预览">▶️ 预览</button>
        </div>
    </header>

    <!-- 主体三栏布局 -->
    <main class="main-layout">
        <!-- 左侧：场景树 + 资源面板 -->
        <aside class="left-panel">
            <div class="panel-tabs">
                <button class="tab-btn active" data-tab="scenes">🎬 场景</button>
                <button class="tab-btn" data-tab="characters">👤 角色</button>
                <button class="tab-btn" data-tab="backgrounds">🖼️ 背景</button>
                <button class="tab-btn" data-tab="variables">⚙️ 变量</button>
            </div>

            <!-- 场景树 -->
            <div class="tab-panel active" id="tab-scenes">
                <div class="panel-header">
                    <span>场景列表</span>
                    <button id="btn-add-scene" class="btn-icon" title="添加场景">+</button>
                </div>
                <div id="scene-tree" class="scene-tree"></div>
            </div>

            <!-- 角色管理 -->
            <div class="tab-panel" id="tab-characters">
                <div class="panel-header">
                    <span>角色</span>
                    <button id="btn-add-character" class="btn-icon" title="添加角色">+</button>
                </div>
                <div id="character-list" class="character-list"></div>
            </div>

            <!-- 背景管理 -->
            <div class="tab-panel" id="tab-backgrounds">
                <div class="panel-header">
                    <span>背景</span>
                    <button id="btn-add-bg" class="btn-icon" title="添加背景">+</button>
                </div>
                <div id="bg-list" class="bg-list"></div>
            </div>

            <!-- 变量管理 -->
            <div class="tab-panel" id="tab-variables">
                <div class="panel-header">
                    <span>全局变量</span>
                    <button id="btn-add-var" class="btn-icon" title="添加变量">+</button>
                </div>
                <div id="variable-list" class="variable-list"></div>
            </div>
        </aside>

        <!-- 中间：节点画布 -->
        <section class="center-panel">
            <div class="canvas-toolbar">
                <div class="canvas-tools-left">
                    <button id="btn-add-node" class="btn btn-sm">+ 添加节点</button>
                    <div class="node-type-menu" id="node-type-menu"></div>
                </div>
                <div class="canvas-tools-right">
                    <button id="btn-delete-node" class="btn btn-sm btn-danger" title="删除选中节点">🗑️ 删除</button>
                    <button id="btn-preview-scene" class="btn btn-sm">▶️ 预览当前场景</button>
                </div>
            </div>
            <div id="node-canvas" class="node-canvas">
                <svg id="node-connections" class="node-connections"></svg>
                <div id="nodes-container" class="nodes-container"></div>
            </div>
            <div class="canvas-footer">
                <span id="scene-info">未选择场景</span>
                <span id="node-count">0 个节点</span>
            </div>
        </section>

        <!-- 右侧：属性面板 -->
        <aside class="right-panel">
            <div class="inspector-header">
                <span>属性</span>
                <span id="inspector-type" class="inspector-type">未选中</span>
            </div>
            <div id="inspector-content" class="inspector-content">
                <div class="empty-state">
                    <div class="empty-icon">🖱️</div>
                    <p>选择一个节点以编辑属性</p>
                </div>
            </div>
        </aside>
    </main>

    <!-- 底部预览 -->
    <footer class="preview-panel" id="preview-panel">
        <div class="preview-header">
            <span class="preview-title">▶️ 实时预览</span>
            <div class="preview-controls">
                <button id="btn-preview-play" class="btn-icon" title="播放/继续">▶</button>
                <button id="btn-preview-reset" class="btn-icon" title="重置">⟲</button>
                <button id="btn-preview-skip" class="btn-icon" title="快进">⏩</button>
                <button id="btn-close-preview" class="btn-icon" title="收起">▼</button>
            </div>
        </div>
        <div id="preview-stage" class="preview-stage">
            <div class="vn-background" id="vn-bg"></div>
            <div class="vn-characters" id="vn-chars"></div>
            <div class="vn-dialog-box" id="vn-dialog" style="display:none;">
                <div class="vn-char-name" id="vn-char-name"></div>
                <div class="vn-text" id="vn-text"></div>
                <div class="vn-continue-hint" id="vn-continue-hint">▼</div>
                <div class="vn-choices" id="vn-choices" style="display:none;"></div>
            </div>
            <div class="vn-effects" id="vn-effects"></div>
        </div>
    </footer>

    <!-- 打开剧情模态框 -->
    <div class="modal" id="modal-open">
        <div class="modal-content">
            <div class="modal-header">
                <h3>打开剧情</h3>
                <button class="btn-icon modal-close" data-modal="modal-open">×</button>
            </div>
            <div class="modal-body">
                <div id="story-list" class="story-list"></div>
            </div>
        </div>
    </div>

    <!-- 模块脚本 -->
    <script src="modules/story-schema.js"></script>
    <script src="modules/story-io.js"></script>
    <script src="modules/preview.js"></script>
    <script src="modules/scene-tree.js"></script>
    <script src="modules/node-canvas.js"></script>
    <script src="modules/inspector.js"></script>
    <script src="modules/character-manager.js"></script>
    <script src="modules/character-creator.js"></script>
    <script src="modules/bg-manager.js"></script>
    <script src="modules/variable-manager.js"></script>
    <script src="app.js"></script>
</body>
</html>
